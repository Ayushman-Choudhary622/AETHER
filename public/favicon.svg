  <path d="M18 20C18 16.6863 20.6863 14 24 14C27.3137 14 30 16.6863 30 20C30 22.5 28.5 24.5 26.5 25.5L28.5 31.5L22.5 29.5C21 29.8 19.5 29.5 18 28.5C16 27 15 24.5 15 22C15 21 16 20 18 20Z" fill="url(#aether-grad)" filter="url(#blur-glow)" />
  <circle cx="24" cy="21" r="2.5" fill="#FFFFFF" />
  <circle cx="20" cy="21" r="1.5" fill="#FFFFFF" opacity="0.8" />
  <circle cx="28" cy="21" r="1.5" fill="#FFFFFF" opacity="0.8" />
</svg>